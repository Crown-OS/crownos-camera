[workspace]
members = ["frame", "capture", "record", "still", "app"]
default-members = ["app"]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Crown-OS/crownos-camera"

[workspace.dependencies]
crownos-camera-frame = { path = "frame" }
crownos-camera-capture = { path = "capture" }
crownos-camera-record = { path = "record" }
crownos-camera-still = { path = "still" }
crownos-config = { path = "../crownos-config", default-features = false }
crownui = { path = "../crownui/crownui", features = ["static"] }
crownui-audio = { package = "audio", path = "../crownui/audio" }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossbeam-channel = "0.5"
dirs = "6"
ffmpeg-next = { version = "9.1.0", default-features = false }
pipewire = { version = "0.10.1", features = ["v0_3_44"] }
rustix = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false, features = ["sync", "time"] }
turbojpeg = { version = "1.5", default-features = false, features = ["pkg-config"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
